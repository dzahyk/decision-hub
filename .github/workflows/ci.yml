name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: hub, POSTGRES_PASSWORD: hub, POSTGRES_DB: decision_hub_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hub" --health-interval 3s --health-retries 20
    env:
      DH_TEST_DATABASE_URL: postgresql+psycopg://hub:hub@localhost:5432/decision_hub_test
      DH_DATABASE_URL: postgresql+psycopg://hub:hub@localhost:5432/decision_hub_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv==0.12.7
      - run: uv sync --frozen
      - run: uv run ruff check app tests eval
      - run: uv run pytest
      - run: uv run python scripts/bench_pricing.py
      - run: uv run python -m app.eval.run  # mock provider only; never spends money in CI

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: hub, POSTGRES_PASSWORD: hub, POSTGRES_DB: decision_hub_e2e }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hub" --health-interval 3s --health-retries 20
    env:
      DH_E2E_DATABASE_URL: postgresql+psycopg://hub:hub@localhost:5432/decision_hub_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install uv==0.12.7 && npm install -g pnpm@11.25.0
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: frontend/test-results }

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t decision-hub:ci .
